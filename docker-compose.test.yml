services:
  mysql:
    image: mysql:8.0
    container_name: xboard-test-mysql
    environment:
      MYSQL_DATABASE: xboard_test
      MYSQL_USER: xboard
      MYSQL_PASSWORD: xboard
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - xboard-test-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: xboard-test-redis
    ports:
      - "6380:6379"

  app:
    image: ghcr.io/mitbg000/xboard:latest
    container_name: xboard-test-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: testing
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: xboard_test
      DB_USERNAME: xboard
      DB_PASSWORD: xboard
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: file
      BROADCAST_DRIVER: log
      MAIL_MAILER: log
    command: ["sh", "-lc", "tail -f /dev/null"]

volumes:
  xboard-test-mysql:
